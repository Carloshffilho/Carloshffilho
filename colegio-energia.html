
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colégio Energia — Portfólio</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff7d9;
            color: #111;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        header {
            padding: 32px 0;
            border-bottom: 1px solid #ccc;
        }

        .back {
            color: #111;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        .intro {
            padding: 100px 0 80px;
            border-bottom: 1px solid #ccc;
        }

        .number {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 140px);
            letter-spacing: -0.08em;
            line-height: 1;
            margin: 0 0 35px;
        }

        .description {
            max-width: 650px;
            font-size: 17px;
            line-height: 1.7;
            color: #555;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 65px 0 30px;
        }

        h2 {
            font-size: clamp(28px, 4vw, 48px);
            letter-spacing: -0.055em;
            margin: 0;
        }

        .count {
            font-size: 12px;
            color: #777;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            padding-bottom: 120px;
        }

        .gallery-item {
            border: 0;
            padding: 0;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #fff7d9;
            cursor: zoom-in;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .25s ease;
        }

        .gallery-item:hover img,
        .gallery-item:focus-visible img { transform: scale(1.05); }
        .gallery-item:focus-visible { outline: 3px solid #e30000; outline-offset: 3px; }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .96);
            color: #fff;
        }
        .lightbox.open { display: flex; }
        .lightbox-image {
            display: block;
            max-width: calc(100vw - 150px);
            max-height: calc(100dvh - 130px);
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .lightbox button {
            position: absolute;
            border: 1px solid #777;
            background: rgba(0,0,0,.55);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 25px;
            width: 46px;
            height: 46px;
        }
        .lightbox button:hover, .lightbox button:focus-visible { background: #333; }
        .lightbox-close { top: 20px; right: 20px; }
        .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
        .lightbox-count {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: .08em;
        }

        footer {
            border-top: 1px solid #ccc;
            padding: 35px 0;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 1000px) {
            .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (max-width: 800px) {
            .container { padding: 0 20px; }
            .intro { padding: 70px 0 55px; }
            .section-header { padding-top: 45px; }
        }
        @media (max-width: 700px) {
            .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .lightbox-image { max-width: calc(100vw - 95px); max-height: calc(100dvh - 130px); }
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
            .lightbox button { width: 38px; height: 42px; }
        }
        @media (max-width: 480px) {
            .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .section-header { gap: 15px; }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="back">
                ← VOLTAR AO PORTFÓLIO
            </a>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <div class="number">03 / PROJETOS</div>

            <h1>Colégio Energia<span style="color:#888;">.</span></h1>

            <p class="description">
                Desenvolvimento de peças gráficas e conteúdos digitais
                para redes sociais, com foco na comunicação institucional,
                divulgação de campanhas e iniciativas educacionais.
            </p>
        </section>

        <section>
            <div class="section-header">
                <h2>Conteúdo digital</h2>
                <span class="count">11 PEÇAS</span>
            </div>

            <div class="gallery" id="gallery"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            PORTFÓLIO — DESIGN GRÁFICO
        </div>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualização ampliada de trabalhos" aria-hidden="true">
        <button type="button" class="lightbox-close" id="close" aria-label="Fechar imagem">×</button>
        <button type="button" class="lightbox-prev" id="prev" aria-label="Imagem anterior">‹</button>
        <img class="lightbox-image" id="lightbox-image" alt="">
        <button type="button" class="lightbox-next" id="next" aria-label="Próxima imagem">›</button>
        <span class="lightbox-count" id="counter" aria-live="polite"></span>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const files = [
            ...Array.from({ length: 10 }, (_, i) => `Colégio Energia ${i + 1}.jpg`),
            'Colégio Energia 11.png'
        ];
        const images = files.map(file => `images/colegio-energia/${encodeURIComponent(file)}`);
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const counter = document.getElementById('counter');
        const closeButton = document.getElementById('close');
        let currentIndex = 0;
        let lastFocused = null;
        let touchStartX = null;

        function showImage(index) {
            currentIndex = (index + images.length) % images.length;
            lightboxImage.src = images[currentIndex];
            lightboxImage.alt = `Colégio Energia — peça ${currentIndex + 1}`;
            counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(images.length).padStart(2, '0')}`;
        }

        function openLightbox(index) {
            lastFocused = document.activeElement;
            showImage(index);
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            closeButton.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            if (lastFocused) lastFocused.focus();
        }

        files.forEach((file, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'gallery-item';
            button.setAttribute('aria-label', `Ampliar peça ${index + 1}`);
            const img = document.createElement('img');
            img.src = images[index];
            img.alt = `Colégio Energia — peça ${index + 1}`;
            img.loading = 'lazy';
            button.appendChild(img);
            button.addEventListener('click', () => openLightbox(index));
            gallery.appendChild(button);
        });

        document.getElementById('prev').addEventListener('click', () => showImage(currentIndex - 1));
        document.getElementById('next').addEventListener('click', () => showImage(currentIndex + 1));
        closeButton.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', event => {
            if (!lightbox.classList.contains('open')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
            if (event.key === 'ArrowRight') showImage(currentIndex + 1);
            if (event.key === 'Tab') {
                const controls = [closeButton, document.getElementById('prev'), document.getElementById('next')];
                const current = controls.indexOf(document.activeElement);
                if (current === -1) { event.preventDefault(); closeButton.focus(); return; }
                if (event.shiftKey && current === 0) { event.preventDefault(); controls[2].focus(); }
                else if (!event.shiftKey && current === 2) { event.preventDefault(); controls[0].focus(); }
            }
        });
        lightbox.addEventListener('touchstart', event => {
            touchStartX = event.changedTouches[0].screenX;
        }, { passive: true });
        lightbox.addEventListener('touchend', event => {
            if (touchStartX === null) return;
            const delta = event.changedTouches[0].screenX - touchStartX;
            if (Math.abs(delta) > 50) showImage(currentIndex + (delta < 0 ? 1 : -1));
            touchStartX = null;
        }, { passive: true });
    </script>
</body>
</html>

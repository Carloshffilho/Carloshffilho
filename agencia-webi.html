
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agência WEBi — Portfólio</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f3;
            color: #111;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        header {
            padding: 32px 0;
            border-bottom: 1px solid #ccc;
        }

        .back {
            color: #111;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        .intro {
            padding: 100px 0 80px;
            border-bottom: 1px solid #ccc;
        }

        .number {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(55px, 9vw, 140px);
            letter-spacing: -0.08em;
            line-height: 1;
            margin: 0 0 35px;
        }

        .description {
            max-width: 650px;
            font-size: 17px;
            line-height: 1.7;
            color: #555;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            padding: 65px 0 30px;
        }

        h2 {
            font-size: clamp(28px, 4vw, 48px);
            letter-spacing: -0.055em;
            margin: 0;
        }

        .count {
            font-size: 12px;
            color: #777;
            white-space: nowrap;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            padding-bottom: 120px;
        }

        .thumbnail {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 0;
            border: 1px solid #ddd;
            background: #e6e6e6;
            cursor: zoom-in;
            overflow: hidden;
        }

        .thumbnail img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .25s ease;
        }

        .thumbnail:hover img { transform: scale(1.05); }
        .thumbnail:focus-visible { outline: 3px solid #e30000; outline-offset: 3px; }

        .lightbox[hidden] { display: none; }
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 10, .97);
            color: #fff;
        }

        .lightbox-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            gap: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .05em;
        }

        .lightbox-close, .lightbox-arrow {
            border: 0;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
        }

        .lightbox-close { font-size: 30px; line-height: 1; padding: 4px 10px; }
        .lightbox-viewer {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 85px 24px;
        }

        .lightbox-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 16px;
            font-size: 36px;
            line-height: 1;
        }

        .lightbox-prev { left: 16px; }
        .lightbox-next { right: 16px; }
        .lightbox-close:hover, .lightbox-arrow:hover { color: #aaa; }
        .lightbox button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
        body.lightbox-open { overflow: hidden; }

        footer {
            border-top: 1px solid #ccc;
            padding: 35px 0;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 800px) {
            .container {
                padding: 0 20px;
            }

            .intro {
                padding: 70px 0 55px;
            }

            .gallery {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }

            .section-header {
                padding-top: 45px;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .lightbox-top { padding: 14px 16px; }
            .lightbox-viewer { padding: 0 45px 18px; }
            .lightbox-arrow { font-size: 26px; padding: 8px; }
            .lightbox-prev { left: 4px; }
            .lightbox-next { right: 4px; }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html" class="back">
                ← VOLTAR AO PORTFÓLIO
            </a>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <div class="number">04 / PROJETOS</div>

            <h1>Agência WEBi<span style="color:#888;">.</span></h1>

            <p class="description">
                Desenvolvimento de peças gráficas e conteúdos digitais
                para redes sociais, explorando diferentes soluções
                visuais e linguagens de comunicação.
            </p>
        </section>

        <section>
            <div class="section-header">
                <h2>Conteúdo digital</h2>
                <span class="count">14 PEÇAS</span>
            </div>

            <div class="gallery" id="gallery"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            PORTFÓLIO — DESIGN GRÁFICO
        </div>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualização ampliada das peças" hidden>
        <div class="lightbox-top">
            <span id="lightbox-counter" aria-live="polite">01 / 14</span>
            <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Fechar imagem">×</button>
        </div>
        <div class="lightbox-viewer" id="lightbox-viewer">
            <button class="lightbox-arrow lightbox-prev" id="lightbox-prev" type="button" aria-label="Imagem anterior">←</button>
            <img class="lightbox-image" id="lightbox-image" alt="">
            <button class="lightbox-arrow lightbox-next" id="lightbox-next" type="button" aria-label="Próxima imagem">→</button>
        </div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');

        const files = Array.from(
            { length: 14 },
            (_, i) => `${i + 1}.png`
        );

        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const counter = document.getElementById('lightbox-counter');
        const closeButton = document.getElementById('lightbox-close');
        let currentIndex = 0;
        let previousFocus = null;
        let touchStartX = null;

        function showImage(index) {
            currentIndex = (index + files.length) % files.length;
            lightboxImage.src = `images/agencia-webi/${files[currentIndex]}`;
            lightboxImage.alt = `Agência WEBi — peça ${currentIndex + 1}`;
            counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(files.length).padStart(2, '0')}`;
        }

        function openLightbox(index) {
            previousFocus = document.activeElement;
            showImage(index);
            lightbox.hidden = false;
            document.body.classList.add('lightbox-open');
            closeButton.focus();
        }

        function closeLightbox() {
            lightbox.hidden = true;
            document.body.classList.remove('lightbox-open');
            lightboxImage.removeAttribute('src');
            if (previousFocus) previousFocus.focus();
        }

        files.forEach((file, index) => {
            const button = document.createElement('button');
            button.className = 'thumbnail';
            button.type = 'button';
            button.setAttribute('aria-label', `Ampliar peça ${index + 1} de ${files.length}`);
            const img = document.createElement('img');
            img.src = `images/agencia-webi/${file}`;
            img.alt = `Agência WEBi — peça ${index + 1}`;
            img.loading = 'lazy';
            button.appendChild(img);
            button.addEventListener('click', () => openLightbox(index));
            gallery.appendChild(button);
        });

        document.getElementById('lightbox-prev').addEventListener('click', () => showImage(currentIndex - 1));
        document.getElementById('lightbox-next').addEventListener('click', () => showImage(currentIndex + 1));
        closeButton.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', event => {
            if (event.target === lightbox || event.target.id === 'lightbox-viewer') closeLightbox();
        });
        document.addEventListener('keydown', event => {
            if (lightbox.hidden) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') showImage(currentIndex - 1);
            if (event.key === 'ArrowRight') showImage(currentIndex + 1);
            if (event.key === 'Tab') {
                const controls = [closeButton, document.getElementById('lightbox-prev'), document.getElementById('lightbox-next')];
                const current = controls.indexOf(document.activeElement);
                if (event.shiftKey && current <= 0) {
                    event.preventDefault();
                    controls[controls.length - 1].focus();
                } else if (!event.shiftKey && current === controls.length - 1) {
                    event.preventDefault();
                    controls[0].focus();
                }
            }
        });
        lightbox.addEventListener('touchstart', event => {
            touchStartX = event.changedTouches[0].screenX;
        }, { passive: true });
        lightbox.addEventListener('touchend', event => {
            if (touchStartX === null) return;
            const delta = event.changedTouches[0].screenX - touchStartX;
            if (Math.abs(delta) > 55) showImage(currentIndex + (delta < 0 ? 1 : -1));
            touchStartX = null;
        }, { passive: true });
    </script>
</body>
</html>
